name: Compilar para PC

on:
  push:
    branches: [main, 'claude/**']
    paths: ['pc/**', '.github/workflows/pc.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: pc
    env:
      VERSION: 1.0.${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Pruebas
        run: python -m unittest test_core -v

      - name: Bajar yt-dlp y ffmpeg
        run: |
          New-Item -ItemType Directory -Force bin | Out-Null
          Invoke-WebRequest https://github.com/yt-dlp/yt-dlp/releases/latest/download/yt-dlp.exe -OutFile bin\yt-dlp.exe
          Invoke-WebRequest https://github.com/yt-dlp/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination bin
          Remove-Item ffmpeg.zip, ffmpeg-tmp -Recurse -Force
          bin\yt-dlp.exe --version
          bin\ffmpeg.exe -version | Select-Object -First 1

      - name: Compilar programa
        run: |
          "VERSION = '$env:VERSION'" | Out-File -Encoding utf8 version.py
          python -m pip install --upgrade pip pyinstaller
          pyinstaller --noconfirm --clean --windowed --name DescargarVideo --icon icono.ico app.py
          Copy-Item bin dist\DescargarVideo\bin -Recurse
          Copy-Item icono.ico dist\DescargarVideo\

      - name: Comprobar que arranca
        run: |
          $p = Start-Process dist\DescargarVideo\DescargarVideo.exe -ArgumentList '--selftest', "$PWD\selftest.txt" -Wait -PassThru
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "La comprobación falló" }

      - name: Prueba con internet (informativa)
        continue-on-error: true
        timeout-minutes: 8
        run: python online_check.py

      - name: Crear instalador
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc "/DAppVersion=$env:VERSION" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup falló" }
          Compress-Archive -Path dist\DescargarVideo -DestinationPath salida\DescargarVideo-Portable.zip
          Get-ChildItem salida | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: DescargarVideo-PC
          path: pc/salida/*

      # Release aparte del APK (no se marca como "latest" para no tapar la descarga del teléfono).
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: pc-v${{ env.VERSION }}
          name: Descargar Video para PC ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: false
          body: |
            Programa para Windows 10/11.
            - **DescargarVideo-Instalador.exe**: lo instalas y queda en el escritorio y el menú Inicio.
            - **DescargarVideo-Portable.zip**: sin instalar; descomprime y abre DescargarVideo.exe.
            Si Windows muestra "Windows protegió su PC", toca "Más información" y luego "Ejecutar de todas formas".
          files: |
            pc/salida/DescargarVideo-Instalador.exe
            pc/salida/DescargarVideo-Portable.zip
