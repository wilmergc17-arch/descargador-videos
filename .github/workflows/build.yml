name: Compilar APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        run: ./gradlew assembleRelease --stacktrace

      - name: Renombrar APK
        run: cp app/build/outputs/apk/release/app-release.apk DescargarVideo.apk

      - uses: actions/upload-artifact@v4
        with:
          name: DescargarVideo
          path: DescargarVideo.apk

      # Publica el APK como "release" para descargarlo directo desde el teléfono.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Descargar Video 1.0.${{ github.run_number }}
          files: DescargarVideo.apk
          make_latest: true
